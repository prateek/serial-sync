# Install as serial-sync.service.d/execution.conf. Keep existing capacity checks.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 -u %h/serial-sync-runner/runner.py --config %h/serial-sync/config/runner.toml execute -- /usr/bin/docker compose run --rm --name serial-sync-hourly sync
SuccessExitStatus=75
