# Install under serial-sync-manual@.service.d/ after copying the effective base unit.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 -u %h/serial-sync-runner/runner.py --config %h/serial-sync/config/runner.toml --origin manual --request-key %i execute -- /usr/bin/docker compose run --rm --name serial-sync-hourly sync
SuccessExitStatus=75
